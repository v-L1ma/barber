<header class="header">
  <div class="header__brand">
    <div class="header__logo-wrap">
      <div class="header__logo-box text-on-primary">
        <span class="material-symbols-outlined">content_cut</span>
      </div>
      <div class="header__titles">
        <h1>Time4Barber</h1>
        <span>Enterprise Edition</span>
      </div>
    </div>
    <nav class="header__nav">
      <button class="header__nav-btn" [routerLink]="'/servicos/agendamento'"
        routerLinkActive="header__nav-btn--active">Agendamento</button>
      <button class="header__nav-btn" [routerLink]="'/servicos/meus-agendamentos'"
        routerLinkActive="header__nav-btn--active">Histórico</button>
      <button class="header__nav-btn" [routerLink]="'/perfil'" routerLinkActive="header__nav-btn--active">Minha
        Conta</button>
    </nav>
  </div>
  <div class="header__actions">
    <button class="header__action-btn">
      <span class="material-symbols-outlined">notifications</span>
    </button>
    <button class="header__action-btn" (click)="logout()">
      <span class="material-symbols-outlined">logout</span>
    </button>
  </div>
</header>
